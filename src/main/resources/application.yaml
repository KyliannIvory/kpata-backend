spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:my-very-big-secret-phrase-for-signature}
  # TODO(auth): 300000 ms = 5 minutes, et il n'existe aucun mécanisme de refresh token.
  # Le frontend sera donc déconnecté (401) toutes les 5 minutes sans avertissement.
  # Décision à prendre consciemment (pas juste "mettre une grosse valeur au hasard) :
  # voir docs/auth-frontend-readiness.md, section 3, pour les options et leurs compromis.
  expiration: 300000